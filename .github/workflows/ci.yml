name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up CPython ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Verify code formatting (ruff format)
        run: |
          ruff format --check .

      - name: Lint codebase (ruff check)
        run: |
          ruff check .

      - name: Run test suite (pytest)
        run: |
          pytest -v

      - name: Execute runtime demonstration (app.py)
        run: |
          python app.py

      - name: Verify package build (pip wheel)
        run: |
          pip wheel . --no-deps -w dist
